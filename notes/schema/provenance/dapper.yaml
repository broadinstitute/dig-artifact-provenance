id: https://cfdeknowledge.org/nih-mcp-gateway/dapper
name: dapper
title: DAPPER - NIH Dataset Attribution and Provenance Profile (working title)
description: >-
  A LinkML data model for the NIH Dataset Attribution and Provenance Profile
  (NIH-DAPP). Every dataset returned through an NIH MCP server should carry
  enough structured metadata for an AI system to cite the dataset, identify its
  creators, link to the primary publication, report the NIH grant/award that
  supported it, and describe the provenance of the returned result. The "2.0"
  profile is the 1.0 citation/funding/provenance core (JSON-LD + DataCite +
  PROV-O + schema.org) plus GA4GH DRS object identity, DUO data-use terms,
  RO-Crate packaging, and BioCompute/IEEE-2791 executable workflow provenance.

  This "3.0" profile is a SUPERSET of 2.0 — every 2.0 class, slot, and enum is
  carried forward unchanged — and adds three blocks, each annotated
  `nih:profile_level: "3.0"`:

    (A) DISMECH HARMONIZATION. Cross-walk mappings onto the Monarch Initiative
        DISMECH disease-pathophysiology schema
        (https://w3id.org/monarch-initiative/dismech), so the two models stay
        harmonized without either one forking the other. DISMECH is mirrored
        verbatim from upstream and is NOT edited; all harmonization lives here
        as `exact_mappings` / `close_mappings` plus a `DismechLinked` mixin
        carrying pointers. Reuse, don't reinvent.

    (B) NANOPUBLICATION. The nanopublication model as used by the Nanodash /
        Knowledge Pixels stack: the Head/assertion/provenance/pubinfo quad and
        the npx signature + lifecycle (supersedes / retracts / introduces)
        terms. Lets a NIH-DAPP object be emitted as, or minted from, a signed
        nanopublication.

    (D) AGENTIC REPLAY (3.1). `AgenticWorkspace` — the workspace and prompt an
        AI agent can use to re-run an `Activity`. The executable provenance a
        1.0 Activity carries (`command`, `container_image`, `code_version`) is
        the machine replay path; this is the agentic one, alongside it rather
        than instead of it. A prompt is NOT a deterministic replay mechanism,
        so the two are deliberately not interchangeable.

    (C) HYPOTHESIS. A FAIR-digital-object hypothesis — the REVEAL output — as
        a gene -> mechanism -> disease causal chain. Structurally compatible
        with dismech.monarchinitiative.org (it reuses DISMECH's hypothesis
        grouping, causal-edge, and evidence shapes and its CausalLinkTypeEnum
        values verbatim) and carries full attribution/provenance by mixing in
        `ProvenancedResource`, so a hypothesis is citable exactly like a
        dataset.

  The schema is shaped as a Dock knowledge graph: NIH resources, agents,
  awards, publications, hypotheses, and nanopublications are Node entities;
  attribution, provenance, and causal assertions are Edge relationships.
license: https://creativecommons.org/licenses/by/4.0/
version: 3.2.0

# ---------------------------------------------------------------------------
# MIRRORING INVARIANT (George Papanicolaou, NIH/OD — the profile's hard rule)
#
#   Mirrors (OpenAI, Anthropic, Google, Microsoft, AWS, ... regional caches)
#   MAY cache NIH resources and MAY APPEND a `mirror_provenance` object, but
#   they MUST NOT modify any element annotated `nih:mirror_mutable: false`
#   (the authoritative NIH provenance: creators, funding, publications,
#   recommended_citation). Rewriting authoritative provenance causes drift and
#   makes the attribution worthless. Full enforcement is a downstream validator
#   (see README) that diffs a mirrored object against the authoritative one
#   over the `mirror_mutable: false` closure; this schema encodes the intent
#   via per-class / per-edge annotations.
# ---------------------------------------------------------------------------
comments:
  - >-
    Authoritative NIH provenance (creators, funding, publications,
    recommended_citation) is annotated `nih:mirror_mutable: false` and MUST NOT
    be rewritten by mirrors. Mirrors may only append `mirror_provenance`
    (MirrorProvenance / HasMirrorProvenance, annotated `nih:append_only: true`).

default_prefix: nih
default_range: string

# PREFIX POLICY
#   A CURIE is asserted here ONLY if it resolves to a defined term in a real
#   RDF/OWL vocabulary. Several standards in this profile (DataCite kernel-4,
#   GA4GH DRS, RO-Crate, IEEE-2791/BioCompute) are XML- or JSON-Schema specs
#   with NO RDF vocabulary — inventing `drs:DrsObject`-style IRIs for them
#   would produce mappings that never dereference. Those standards are instead
#   recorded as human-facing `aliases` (the source element name) and a
#   `nih:source_standard` annotation. All obo/DUO/IAO CURIEs were verified
#   against EBI OLS4; FRAPO/FaBiO/SPDX/SPAR-DataCite against their published
#   specs.
#   3.0 additions: the nanopublication prefixes below were each dereferenced
#   and read before use (`np` and `npx` and `hycl` all serve Turtle at their
#   namespace IRI); the terms mapped in block (B) are quoted from those live
#   ontology documents, not recalled. `ntemplate` is the Nanodash template
#   vocabulary observed in published Knowledge Pixels nanopubs. `dismech` is
#   the upstream DISMECH schema's own declared prefix, copied verbatim from
#   its `prefixes:` block so cross-walk CURIEs resolve.
prefixes:
  nih: https://nih.gov/ns/mcp#
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  prov: http://www.w3.org/ns/prov#
  # --- 3.0: nanopublication (verified by dereferencing each namespace) ---
  # Nanopublication schema. Defines Nanopublication/Assertion/Provenance/
  # PublicationInfo and the three functional hasX properties.
  np: http://www.nanopub.org/nschema#
  # Nanopub-X: extensions (signatures, supersedes/retracts/introduces,
  # SoftwareAgent, nanopub types).
  npx: http://purl.org/nanopub/x/
  # HYCL — Hypotheses and Claims Ontology (petapico). Thin: Statement,
  # AIDA-Sentence, claims, discusses, and statement-relation properties.
  hycl: http://purl.org/petapico/o/hycl#
  # Nanodash / Knowledge Pixels template vocabulary.
  ntemplate: https://w3id.org/np/o/ntemplate/
  # --- 3.0: DISMECH cross-walk ---
  dismech: https://w3id.org/monarch-initiative/dismech/
  # SKOS — used for instance-level cross-walk predicates (closeMatch). Also
  # DISMECH's own declared prefix for the same namespace.
  skos: http://www.w3.org/2004/02/skos/core#
  MONDO: http://purl.obolibrary.org/obo/MONDO_
  HGNC: https://www.genenames.org/data/gene-symbol-report/#!/hgnc_id/
  PMID: http://www.ncbi.nlm.nih.gov/pubmed/
  # SPAR DataCite Ontology (identifier-focused). NOT the kernel-4 XSD —
  # kernel-4 defines XML elements, not RDF properties.
  datacite: http://purl.org/spar/datacite/
  # FRAPO — Funding, Research Administration and Projects Ontology.
  frapo: http://purl.org/cerif/frapo/
  dcterms: http://purl.org/dc/terms/
  dctype: http://purl.org/dc/dcmitype/
  dcat: http://www.w3.org/ns/dcat#
  foaf: http://xmlns.com/foaf/0.1/
  fabio: http://purl.org/spar/fabio/
  spdx: http://spdx.org/rdf/terms#
  duo: http://purl.obolibrary.org/obo/DUO_
  obo: http://purl.obolibrary.org/obo/
  orcid: https://orcid.org/
  ror: https://ror.org/
  doi: https://doi.org/
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  xsd: http://www.w3.org/2001/XMLSchema#

imports:
  - linkml:types

# ===========================================================================
# ENUMS
# ===========================================================================
enums:
  ResourceTypeEnum:
    description: DataCite-style resource type (resourceTypeGeneral) for the returned entity.
    permissible_values:
      Dataset:
        meaning: schema:Dataset
      Collection:
        meaning: dctype:Collection
      Set:
        meaning: prov:Collection
        description: A collection of members (e.g. a gene set); see the Set class.
      GeneSet:
        description: >-
          A set whose members are genes (dig.geneset). No ontology term is
          asserted (none resolves); grounded via the Set class (prov:Collection).
      Software:
        meaning: schema:SoftwareApplication
      Workflow:
      Model:
      Service:
        meaning: schema:Service

  CreatorRoleEnum:
    description: The role a creator (Person/Organization) played for the dataset.
    permissible_values:
      PrincipalInvestigator:
      Researcher:
      DataManager:
      ProjectLeader:
      Curator:
      Consortium:
      Organization:
      Division:
      Group:

  ContributorRoleEnum:
    description: >-
      The role a contributing agent played. Values mirror the DataCite
      kernel-4 `contributorType` enumeration. No `meaning:` CURIEs: kernel-4 is
      an XML Schema, so these are XSD enumeration values with no RDF term to
      point at.
    annotations:
      nih:source_standard: DataCite kernel-4 contributorType
    permissible_values:
      DataCurator:
        description: DataCite contributorType "DataCurator".
      HostingInstitution:
        description: DataCite contributorType "HostingInstitution".
      DataManager:
        description: DataCite contributorType "DataManager".
      Producer:
        description: DataCite contributorType "Producer".
      RightsHolder:
        description: DataCite contributorType "RightsHolder".
      Sponsor:
        description: DataCite contributorType "Sponsor".
      Other:
        description: DataCite contributorType "Other".

  PublicationRelationshipEnum:
    description: >-
      How a publication relates to the dataset. Values mirror the DataCite
      kernel-4 `relationType` enumeration (an XSD enumeration, hence no
      `meaning:` CURIEs).
    annotations:
      nih:source_standard: DataCite kernel-4 relationType
    permissible_values:
      IsDescribedBy:
        description: DataCite relationType "IsDescribedBy".
      IsSupplementTo:
        description: DataCite relationType "IsSupplementTo".
      IsCitedBy:
        description: DataCite relationType "IsCitedBy".
      Cites:
        description: DataCite relationType "Cites".
      IsReferencedBy:
        description: DataCite relationType "IsReferencedBy".

  AccessLevelEnum:
    description: Coarse access classification for the dataset.
    permissible_values:
      public:
      controlled:
      mixed:

  FunderIdentifierTypeEnum:
    description: Type of the funder identifier.
    permissible_values:
      Crossref_Funder_ID:
        description: Crossref Funder Registry ID.
      ROR:
        description: Research Organization Registry ID.
      GRID:
      ISNI:
      Other:

  IdentifierTypeEnum:
    description: Type of a dataset persistent identifier.
    permissible_values:
      DOI:
      Handle:
      ARK:
      Accession:
      URL:

  DataUsePermissionEnum:
    description: >-
      Primary consent permission governing use of the dataset. Values are the
      children of DUO:0000001 "data use permission" (Data Use Ontology);
      `meaning` CURIEs were verified against EBI OLS4.
    permissible_values:
      no_restriction:
        meaning: duo:0000004
        description: DUO:0000004 — no restriction (NRES).
      general_research_use:
        meaning: duo:0000042
        description: >-
          DUO:0000042 — general research use (GRU); includes health/biomedical,
          fundamental biology, ancestry, methods, and social-sciences research.
      population_origins_ancestry_research_only:
        meaning: duo:0000011
        description: DUO:0000011 — population origins or ancestry research only (POA).

  DataUseModifierEnum:
    description: >-
      Additional conditions attached to a data use permission. Values are the
      children of DUO:0000017 "data use modifier"; `meaning` CURIEs were
      verified against EBI OLS4.
    permissible_values:
      research_specific_restrictions:
        meaning: duo:0000012
      no_general_methods_research:
        meaning: duo:0000015
      genetic_studies_only:
        meaning: duo:0000016
      not_for_profit_non_commercial_use_only:
        meaning: duo:0000018
      publication_required:
        meaning: duo:0000019
      collaboration_required:
        meaning: duo:0000020
      ethics_approval_required:
        meaning: duo:0000021
      geographical_restriction:
        meaning: duo:0000022
      publication_moratorium:
        meaning: duo:0000024
      time_limit_on_use:
        meaning: duo:0000025
      user_specific_restriction:
        meaning: duo:0000026
      project_specific_restriction:
        meaning: duo:0000027
      institution_specific_restriction:
        meaning: duo:0000028
      return_to_database_or_resource:
        meaning: duo:0000029
      clinical_care_use:
        meaning: duo:0000043
      population_origins_ancestry_research_prohibited:
        meaning: duo:0000044

  ProvEdgeRoleEnum:
    description: >-
      Semantic role of a provenance edge, providing a home for the three
      dig.geneset (CFDE provenance graph) edge labels — "data input",
      "metadata input", "data output" — expressed as PROV-O predicates.
    permissible_values:
      data_input:
        meaning: prov:used
        description: An input data entity an activity used (dig.geneset "data input").
      metadata_input:
        meaning: prov:used
        description: >-
          A reference/annotation entity an activity used (dig.geneset
          "metadata input"); same prov:used predicate, distinguished by role.
      data_output:
        meaning: prov:wasGeneratedBy
        description: An entity an activity generated (dig.geneset "data output").

  # =========================================================================
  # 3.0 ENUMS — hypothesis + nanopublication
  # =========================================================================

  CausalLinkTypeEnum:
    description: >-
      Directness of a causal step. Values are copied VERBATIM from DISMECH's
      `CausalLinkTypeEnum` (dismech:CausalLinkTypeEnum) so a NIH-DAPP causal
      step round-trips into a DISMECH `CausalEdge.causal_link_type` with no
      value translation. Do not add or rename values here without changing
      them upstream first.
    exact_mappings:
      - dismech:CausalLinkTypeEnum
    annotations:
      nih:profile_level: "3.0"
      nih:source_standard: DISMECH CausalLinkTypeEnum
    permissible_values:
      DIRECT:
        description: The subject acts directly on the object; no intermediates.
      INDIRECT_KNOWN_INTERMEDIATES:
        description: >-
          Indirect, and the intervening mechanisms are known and should be
          listed in `intermediate_mechanisms`.
      INDIRECT_UNKNOWN_INTERMEDIATES:
        description: Indirect, but the intervening mechanisms are not known.
      UNKNOWN:
        description: Directness has not been determined.

  HypothesisStatusEnum:
    description: >-
      Lifecycle state of a hypothesis. `canonical` / `alternative` mirror the
      role DISMECH's `MechanisticHypothesis.status` plays when organising
      causal edges into competing explanatory models.
    annotations:
      nih:profile_level: "3.0"
    permissible_values:
      proposed:
        description: Generated but not yet reviewed.
      canonical:
        description: The accepted/consensus explanatory model for this disease.
      alternative:
        description: A credible competing explanatory model.
      contested:
        description: Actively disputed; see linked evidence on both sides.
      refuted:
        description: Evidence is judged to refute this hypothesis.
      retracted:
        description: >-
          Withdrawn by its creator. When published as a nanopublication this
          SHOULD be accompanied by an npx:RetractionNanopub.

  EvidenceDirectionEnum:
    description: >-
      Whether an evidence item supports or opposes the claim it is attached to.
      Matches the boolean sense of DISMECH's `EvidenceItem.supports` while
      allowing an explicit "mixed"/"unknown" rather than overloading a boolean.
    close_mappings:
      - dismech:EvidenceItem
    annotations:
      nih:profile_level: "3.0"
    permissible_values:
      supports:
      refutes:
      mixed:
      unknown:

  NanopubTypeEnum:
    description: >-
      Nanopublication subtypes from Nanopub-X (npx), used as the object of
      `npx:hasNanopubType`. Each `meaning` was read from the live npx ontology
      document at http://purl.org/nanopub/x/.
    annotations:
      nih:profile_level: "3.0"
      nih:source_standard: Nanopub-X (http://purl.org/nanopub/x/)
    permissible_values:
      ExampleNanopub:
        meaning: npx:ExampleNanopub
        description: Published for testing; content should not be taken seriously.
      DraftNanopub:
        meaning: npx:DraftNanopub
        description: Marked as work-in-progress.
      MetaNanopub:
        meaning: npx:MetaNanopub
        description: A nanopublication about other nanopublications.
      ProtectedNanopub:
        meaning: npx:ProtectedNanopub
        description: Not intended to be shared publicly.
      RetractionNanopub:
        meaning: npx:RetractionNanopub
        description: Retracts a previously published nanopublication.
      IntroNanopub:
        meaning: npx:IntroNanopub
        description: Introduces an agent and its public key.

# ===========================================================================
# SLOTS — the required Dock Knowledge Graph skeleton (do not remove).
# Shapes match the canonical scaffold in the akleao CLI (models.py).
# ===========================================================================
slots:
  id:
    is_a: literal
    identifier: true
    slot_uri: schema:identifier
    exact_mappings:
      - dcterms:identifier
    close_mappings:
      - datacite:hasIdentifier
    aliases:
      - identifier
      - PID
    description: >-
      Unique identifier for a node — a CURIE shorthand or a full URI. For a
      Dataset this is its persistent identifier (e.g. a DOI).
    required: true
  name:
    is_a: literal
    mixins: [hashable]
    slot_uri: rdfs:label
    exact_mappings:
      - schema:name
      - dcterms:title
    aliases:
      - title
      - label
    description: Human-readable name/label for a node.
  literal:
    slot_uri: rdfs:literal
    range: string
    description: >-
      Abstract base for scalar (data) attributes. Concrete scalar slots
      declare `is_a: literal`.
  relationship:
    slot_uri: rdf:type
    range: uriorcurie
    description: >-
      Abstract base for cross-references between nodes. Concrete reference
      slots declare `is_a: relationship` with `range: uriorcurie` and point at
      another node's `id`.
  # --- identity axis (DAPPER-ID-1) -----------------------------------------
  # Orthogonal to literal/relationship above: that axis says what a slot IS,
  # this one says whether it CONSTITUTES the instance's identity. Every
  # attribute declares exactly one, enforced by schema/identity/lint_identity.py.
  hashable:
    description: >-
      Marks a slot as constituting the identity of its instance. Changing its
      value changes the instance's digest and therefore its `id`.
  unhashable:
    description: >-
      Marks a slot as excluded from the digest: temporal, environmental,
      signature, mirror-observed, or a back-reference derivable from a forward
      edge. Changing it MUST NOT change the instance's `id`.

  subject:
    slot_uri: rdf:subject
    range: uriorcurie
    description: The subject node of an Edge (its `id`/CURIE).
  predicate:
    slot_uri: rdf:predicate
    range: uriorcurie
    description: The predicate (relationship type) of an Edge.
  object:
    slot_uri: rdf:object
    range: uriorcurie
    description: The object node of an Edge (its `id`/CURIE).

# ===========================================================================
# CLASSES
# ===========================================================================
classes:

  # ---- Required KG skeleton base classes ---------------------------------
  Node:
    abstract: true
    description: >-
      Abstract base for all NIH-DAPP entities (datasets, agents, awards,
      publications, licenses, activities, mirror records, ...). Not used
      directly.
    slots:
      - id
      - name

  HashableNode:
    is_a: Node
    abstract: true
    description: >-
      A Node whose `id` is a computed content address of the form
      `dapper:{ClassName}.{digest}` — the full LinkML class name, a dot, then a
      GA4GH `sha512t24u` digest over the slots marked `hashable`.

      The digest covers hashable slots ONLY. Timestamps, signatures, mirror
      observations, workspace locations, and back-references are marked
      `unhashable` so that re-running, re-signing, mirroring, or re-hosting an
      artifact never changes what it is. See schema/identity/README.md for the
      DAPPER-ID-1 profile and schema/trusty-identifiers.md for why this is
      deliberately NOT a Trusty URI `RA` code.
    annotations:
      dapper:id_profile: DAPPER-ID-1

  Edge:
    abstract: true
    class_uri: rdf:Statement
    description: >-
      Abstract base for all NIH-DAPP attribution/provenance relationships,
      fixed to rdf:Statement. Not used directly.
    slots:
      - subject
      - predicate
      - object

  # ======================================================================
  # NODE (entity) classes — 1.0 CORE
  # ======================================================================

  # ======================================================================
  # MIXINS — reusable slot bundles applied to more than one entity class.
  # ======================================================================

  PortalLinked:
    mixin: true
    description: >-
      Mixin adding the two portal landing-page links (dcc_url / drc_url) that
      every dig.geneset (CFDE provenance graph) node carries. Applied to Set,
      C2M2File, and Activity.
    attributes:
      dcc_url:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        slot_uri: schema:url
        close_mappings:
          - dcat:landingPage
        aliases:
          - dcc_url
        annotations:
          nih:source_standard: CFDE dig.geneset dcc_url
        description: URL to the source DCC portal page for this resource.
      drc_url:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        slot_uri: schema:url
        close_mappings:
          - dcat:landingPage
        aliases:
          - drc_url
        annotations:
          nih:source_standard: CFDE dig.geneset drc_url
        description: URL to the DRC (CFDE Workbench) entity/resource page.

  ProvenancedResource:
    mixin: true
    description: >-
      The shared attribution + funding + publication + provenance + license +
      access + mirror slots carried by any citable resource. Applied as a mixin
      to both `Dataset` (a set of data) and `Set` (a collection of members, e.g.
      a gene set), so George's mirroring invariant and the DataCite/PROV
      attribution model bind identically to datasets and gene sets. Every
      `nih:mirror_mutable: false` slot here is authoritative NIH provenance a
      mirror MUST NOT rewrite.
    attributes:
      access_level:
        is_a: literal
        mixins: [hashable]
        range: AccessLevelEnum
        slot_uri: dcterms:accessRights
        close_mappings:
          - schema:conditionsOfAccess
        aliases:
          - accessRights
      alternate_identifier:
        is_a: literal
        mixins: [hashable]
        multivalued: true
        slot_uri: dcterms:identifier
        exact_mappings:
          - datacite:hasIdentifier
        description: >-
          Externally-assigned persistent identifiers for this resource — a DOI,
          an accession, a Handle, an ARK. `id` is DAPPER's own computed content
          address (`dapper:{ClassName}.{digest}`), which answers "what exactly
          is this record?". A DOI answers "what does the publisher call this,
          and how do I cite it?". Both are worth keeping, so neither displaces
          the other. `identifier_type` names the scheme.
        annotations:
          nih:profile_level: "3.2"
          nih:source_standard: DataCite kernel-4 identifier/alternateIdentifiers
      controlled_access:
        is_a: literal
        mixins: [hashable]
        range: boolean
        close_mappings:
          - dcterms:accessRights
      # --- inline attribution/provenance links (each is a graph edge) ---
      has_creator:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: schema:creator
        exact_mappings:
          - dcterms:creator
        close_mappings:
          - prov:wasAttributedTo
        description: Authoritative creators (Person/Organization CURIEs).
        annotations:
          nih:authoritative: true
          nih:mirror_mutable: false
          nih:source_standard: DataCite kernel-4 creators
      has_contributor:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: dcterms:contributor
      funded_by:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: schema:funding
        exact_mappings:
          - frapo:isSupportedBy
        close_mappings:
          - schema:funder
        aliases:
          - funding
          - fundingReference
        description: Authoritative Award CURIEs supporting this resource.
        annotations:
          nih:authoritative: true
          nih:mirror_mutable: false
          nih:source_standard: DataCite kernel-4 fundingReference
      is_described_by:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: dcterms:isReferencedBy
        close_mappings:
          - schema:subjectOf
        aliases:
          - IsDescribedBy
        description: Authoritative primary Publication CURIEs.
        annotations:
          nih:authoritative: true
          nih:mirror_mutable: false
          nih:source_standard: DataCite kernel-4 relatedIdentifier/IsDescribedBy
      has_license:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: dcterms:license
        exact_mappings:
          - schema:license
        aliases:
          - license
        description: CURIE/URI of the License node.
      was_generated_by:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: prov:wasGeneratedBy
        description: The Activity that generated/packaged this returned result.
      was_derived_from:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: prov:wasDerivedFrom
      was_attributed_to:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: prov:wasAttributedTo
      has_recommended_citation:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: dcterms:bibliographicCitation
        description: The authoritative RecommendedCitation node.
        annotations:
          nih:authoritative: true
          nih:mirror_mutable: false
      # --- mirror (append-only; NOT authoritative) ---
      has_mirror_provenance:
        is_a: relationship
        mixins: [unhashable]  # mirror-observed
        range: uriorcurie
        multivalued: true
        description: >-
          Mirror-appended provenance records. Append-only; mirrors add these
          but must not touch authoritative fields.
        annotations:
          nih:mirror_mutable: true
          nih:append_only: true

  Dataset:
    is_a: HashableNode
    mixins:
      - ProvenancedResource
      # 3.0: lets a Dataset point at the DISMECH entry describing its science.
      - DismechLinked
    class_uri: schema:Dataset
    aliases:
      - dataset
      - data set
      - resource
    exact_mappings:
      - dcat:Dataset
      - dctype:Dataset
    close_mappings:
      - prov:Entity
      # 3.0 cross-walk. Complementary halves of one idea: DISMECH's Dataset
      # describes the SCIENCE (organism, data_type, sample_types, platform,
      # findings); this one describes the ATTRIBUTION (creators, funding,
      # licence, DUO terms, DRS identity). Neither duplicates the other, and
      # DISMECH's `accession` is already a CURIE, so it maps onto `id`.
      - dismech:Dataset
    broad_mappings:
      - obo:IAO_0000100      # homogenous data collection ("data set")
    description: >-
      A dataset (or dataset-like resource) returned through an NIH MCP server.
      The node `id` is the dataset's persistent identifier (typically a DOI).
      Attribution/provenance links come from the ProvenancedResource mixin
      (inline `has_*` / `*_by` relationship attributes, natural for MCP
      responses; also reifiable as Edge instances).
    attributes:
      identifier_type:
        is_a: literal
        mixins: [hashable]
        range: IdentifierTypeEnum
        close_mappings:
          - datacite:usesIdentifierScheme
        aliases:
          - identifierType
        annotations:
          nih:source_standard: DataCite kernel-4 identifierType
        description: Type of the dataset's persistent identifier (e.g. DOI).
      version:
        is_a: literal
        mixins: [hashable]
        slot_uri: schema:version
        exact_mappings:
          - dcterms:hasVersion
        description: Dataset version string (e.g. "2.1.0").
      resource_type:
        is_a: literal
        mixins: [hashable]
        range: ResourceTypeEnum
        slot_uri: dcterms:type
        aliases:
          - resourceTypeGeneral
        annotations:
          nih:source_standard: DataCite kernel-4 resourceTypeGeneral
      publication_year:
        is_a: literal
        mixins: [hashable]
        range: integer
        slot_uri: schema:datePublished
        close_mappings:
          - dcterms:issued
        aliases:
          - publicationYear
        annotations:
          nih:source_standard: DataCite kernel-4 publicationYear
      description:
        is_a: literal
        mixins: [hashable]
        slot_uri: dcterms:description
        exact_mappings:
          - schema:description
        aliases:
          - abstract
      publisher:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: dcterms:publisher
        exact_mappings:
          - schema:publisher
        description: CURIE/URI of the publishing Organization.
      # attribution/funding/provenance/license/access/mirror slots come from
      # the ProvenancedResource mixin. Dataset-specific 2.0 links follow.
      # --- 2.0 links ---
      has_data_use_term:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        broad_mappings:
          - duo:0000001
          - duo:0000017
        close_mappings:
          - dcterms:accessRights
        aliases:
          - data_use_limitations
        description: DUO term CURIEs constraining permitted use.
        annotations:
          nih:profile_level: "2.0"
      has_drs_object:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: dcat:distribution
        close_mappings:
          - schema:distribution
        annotations:
          nih:profile_level: "2.0"
      packaged_as:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        close_mappings:
          - dcterms:isPartOf
        annotations:
          nih:profile_level: "2.0"
      has_workflow_provenance:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        annotations:
          nih:profile_level: "2.0"

  # ======================================================================
  # SET — a collection of members (prov:Collection). Distinct from Dataset
  # (a set of *data*, schema:Dataset). A gene set is a set of genes; protein
  # sets, variant sets, etc. extend Set the same way GeneSet does.
  # ======================================================================
  Set:
    is_a: HashableNode
    mixins:
      - ProvenancedResource
      - PortalLinked
    class_uri: prov:Collection
    close_mappings:
      - schema:Collection
    aliases:
      - collection
      - member set
    description: >-
      A collection of members — "an entity that provides a structure to some
      constituents, which are themselves entities" (prov:Collection). Set is
      deliberately separate from Dataset: a Dataset is a set of *data*
      (schema:Dataset); a Set is a set of *things* (genes, proteins, variants).
      Members are referenced via `prov:hadMember`. Set carries the same
      attribution/provenance/mirror slots (ProvenancedResource) as Dataset, so
      a returned set is citable and its authoritative provenance is
      mirror-protected identically.
    attributes:
      description:
        is_a: literal
        mixins: [hashable]
        slot_uri: dcterms:description
        exact_mappings:
          - schema:description
        aliases:
          - abstract
      members:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: prov:hadMember
        aliases:
          - hasMember
        description: >-
          The set's constituent members (CURIEs). Optional — a large set may
          instead reference its member manifest (e.g. a .gmt) via a member
          artifact rather than enumerating members inline.
      member_type:
        is_a: literal
        mixins: [hashable]
        description: The kind of member the set collects (e.g. gene, protein, variant).
      n_members:
        is_a: literal
        mixins: [hashable]
        range: integer
        close_mappings:
          - schema:numberOfItems
        description: Count of members in the set.

  GeneSet:
    is_a: Set
    aliases:
      - gene set
      - gene set library
      - signature
    description: >-
      A Set whose members are genes (the dig.geneset standard from
      flannick/dig-gene-set-extractors). No ontology term is asserted as
      class_uri — none resolves to "gene set" (verified against EBI OLS4) — so
      GeneSet grounds via `is_a: Set` (prov:Collection). NB: a dig.geneset
      "gene set" is frequently a *library* of many named term→genes sets (the
      .gmt); `n_genes` counts unique genes, `n_sets` the named subsets.
    annotations:
      nih:profile_level: "2.0"
      nih:source_standard: dig.geneset 0.1.0 (flannick/dig-gene-set-extractors)
    attributes:
      assay:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - obo:OBI_0000070      # assay
        description: Assay the gene set derives from (e.g. bulk, sc).
      data_type:
        is_a: literal
        mixins: [hashable]
        description: Molecular data type (e.g. transcriptomics).
      organism:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - schema:taxonomicRange
        description: Organism (e.g. human).
      genome_build:
        is_a: literal
        mixins: [hashable]
        description: Reference genome build (e.g. hg38).
      n_genes:
        is_a: literal
        mixins: [hashable]
        range: integer
        aliases:
          - n_members
        description: Count of unique genes in the set/library.
      n_sets:
        is_a: literal
        mixins: [hashable]
        range: integer
        aliases:
          - n_sets_emitted
        description: Number of named gene sets when this is a library.
      term:
        is_a: literal
        mixins: [hashable]
        description: The term/label a named gene set corresponds to.
      term_prefix:
        is_a: literal
        mixins: [hashable]
        description: Namespace prefix applied to term-derived set names (e.g. HuBMAP).

  Agent:
    mixin: true
    class_uri: prov:Agent
    exact_mappings:
      - foaf:Agent
      - dcterms:Agent
    aliases:
      - agent
      - responsible party
    description: >-
      Mixin for a person or organization (creator, contributor, responsible
      party). Applied to Node subclasses.

  Person:
    is_a: HashableNode
    mixins:
      - Agent
    class_uri: schema:Person
    exact_mappings:
      - foaf:Person
      - prov:Person
    aliases:
      - individual
      - investigator
    attributes:
      given_name:
        is_a: literal
        mixins: [hashable]
        slot_uri: schema:givenName
        exact_mappings:
          - foaf:givenName
        aliases:
          - givenName
          - first name
      family_name:
        is_a: literal
        mixins: [hashable]
        slot_uri: schema:familyName
        exact_mappings:
          - foaf:familyName
        aliases:
          - familyName
          - surname
          - last name
      orcid:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        slot_uri: schema:identifier
        close_mappings:
          - datacite:hasIdentifier
          - datacite:PersonalIdentifier
        aliases:
          - ORCID iD
          - nameIdentifier
        description: ORCID iD (https://orcid.org/....).
      affiliation:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: schema:affiliation
        close_mappings:
          - foaf:member
        description: CURIE/URI of an affiliated Organization.
      creator_role:
        is_a: literal
        mixins: [hashable]
        range: CreatorRoleEnum
        close_mappings:
          - dcterms:creator
      contributor_role:
        is_a: literal
        mixins: [hashable]
        range: ContributorRoleEnum
        close_mappings:
          - dcterms:contributor
        aliases:
          - contributorType

  Organization:
    is_a: HashableNode
    mixins:
      - Agent
    class_uri: schema:Organization
    exact_mappings:
      - foaf:Organization
      - prov:Organization
    aliases:
      - institution
      - consortium
    attributes:
      ror:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        slot_uri: schema:identifier
        close_mappings:
          - datacite:hasIdentifier
          - datacite:OrganizationIdentifier
        aliases:
          - ROR ID
        description: ROR identifier (https://ror.org/...).
      creator_role:
        is_a: literal
        mixins: [hashable]
        range: CreatorRoleEnum
        close_mappings:
          - dcterms:creator
      contributor_role:
        is_a: literal
        mixins: [hashable]
        range: ContributorRoleEnum
        close_mappings:
          - dcterms:contributor
        aliases:
          - contributorType

  Award:
    is_a: HashableNode
    class_uri: schema:MonetaryGrant
    exact_mappings:
      - frapo:Grant
    close_mappings:
      - schema:Grant
    aliases:
      - grant
      - award
      - funding reference
    description: >-
      A grant/award that funded the dataset. Corresponds to a DataCite
      kernel-4 `fundingReference`; RDF grounding is FRAPO (the Funding,
      Research Administration and Projects Ontology), since kernel-4 itself is
      an XML Schema with no RDF terms.
    annotations:
      nih:authoritative: true
      nih:mirror_mutable: false
      nih:source_standard: DataCite kernel-4 fundingReference
    attributes:
      funder_name:
        is_a: literal
        mixins: [hashable]
        slot_uri: frapo:hasFundingAgency
        close_mappings:
          - schema:funder
          - frapo:FundingAgency
        aliases:
          - funderName
      funder_identifier:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        slot_uri: schema:identifier
        close_mappings:
          - datacite:FunderIdentifier
        aliases:
          - funderIdentifier
      funder_identifier_type:
        is_a: literal
        mixins: [hashable]
        range: FunderIdentifierTypeEnum
        close_mappings:
          - datacite:usesIdentifierScheme
        aliases:
          - funderIdentifierType
      award_number:
        is_a: literal
        mixins: [hashable]
        slot_uri: frapo:hasGrantNumber
        close_mappings:
          - schema:identifier
        aliases:
          - awardNumber
          - grant number
      award_uri:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        slot_uri: schema:url
        aliases:
          - awardURI
      award_title:
        is_a: literal
        mixins: [hashable]
        slot_uri: dcterms:title
        aliases:
          - awardTitle
      grant_administering_institute:
        is_a: literal
        mixins: [hashable]
        aliases:
          - administering IC
        description: NIH institute/center administering the grant (e.g. NHLBI).

  Publication:
    is_a: HashableNode
    class_uri: schema:ScholarlyArticle
    exact_mappings:
      - fabio:ResearchPaper
    close_mappings:
      - schema:CreativeWork
      # 3.0 cross-walk. DISMECH's PublicationReference is richer on USE
      # (found_in, findings — which deep-research output cited it, and what it
      # showed) and thinner on IDENTITY (a bare PMID). This class is the
      # identity side; the use side belongs on the edge to the publication.
      - dismech:PublicationReference
      - dctype:Text
    aliases:
      - paper
      - article
      - primary publication
    description: A publication describing or related to the dataset.
    annotations:
      nih:authoritative: true
      nih:mirror_mutable: false
    attributes:
      title:
        is_a: literal
        mixins: [hashable]
        slot_uri: dcterms:title
        exact_mappings:
          - schema:name
      doi:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        slot_uri: schema:identifier
        close_mappings:
          - datacite:ResourceIdentifier
        aliases:
          - DOI
      pmid:
        is_a: literal
        mixins: [hashable]
        slot_uri: fabio:hasPubMedId
        aliases:
          - PMID
          - PubMed ID
        description: PubMed identifier.
      citation:
        is_a: literal
        mixins: [hashable]
        slot_uri: dcterms:bibliographicCitation
        close_mappings:
          - schema:citation
      relationship_type:
        is_a: literal
        mixins: [hashable]
        range: PublicationRelationshipEnum
        close_mappings:
          - dcterms:relation
        aliases:
          - relationType
        annotations:
          nih:source_standard: DataCite kernel-4 relationType

  License:
    is_a: HashableNode
    class_uri: dcterms:LicenseDocument
    exact_mappings:
      - spdx:License
    close_mappings:
      - schema:license
    aliases:
      - licence
      - terms of use
    description: License and usage terms for the dataset.
    attributes:
      url:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        slot_uri: schema:url
        close_mappings:
          - dcterms:license
      usage_terms:
        is_a: literal
        mixins: [hashable]
        slot_uri: dcterms:rights
        close_mappings:
          - schema:usageInfo
        aliases:
          - usageTerms
        description: Human-readable usage terms / obligations.

  Activity:
    is_a: HashableNode
    mixins:
      - PortalLinked
    class_uri: prov:Activity
    close_mappings:
      - schema:Action
      # 3.0 cross-walk. DISMECH's CurationEvent (curation_timestamp /
      # curation_model / curation_action / curation_description) is a homegrown
      # mini-PROV for AI-assisted curation. This PROV-O Activity subsumes it:
      # curation_model -> an npx:SoftwareAgent attributed via the provenance
      # graph, the rest -> generated_at_time / command / description.
      - dismech:CurationEvent
    aliases:
      - process
      - generation activity
      - AnalysisType
    description: >-
      A PROV activity that generated or packaged the returned result
      (e.g. NIH MCP Gateway dataset packaging, or a dig.geneset AnalysisType /
      converter step). The executable-detail attributes below map the
      dig.geneset `analysis{}` block; richer structured parameters/environment
      can be carried by a linked BioComputeObject.
    attributes:
      description:
        is_a: literal
        mixins: [hashable]
        slot_uri: dcterms:description
        exact_mappings:
          - schema:description
      activity_type:
        is_a: literal
        mixins: [hashable]
        slot_uri: dcterms:type
        description: e.g. MCPResourceSerialization.
      command:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - schema:command
        annotations:
          nih:source_standard: dig.geneset analysis.command
        description: The canonical (replay) command that ran this activity.
      observed_command:
        is_a: literal
        mixins: [hashable]
        annotations:
          nih:source_standard: dig.geneset analysis.observed_command
        description: The original runtime command captured, if different from replay.
      script_url:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        close_mappings:
          - schema:codeRepository
        annotations:
          nih:source_standard: dig.geneset analysis.script_url
        description: URL to the script/notebook implementing this activity.
      repo_url:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        close_mappings:
          - schema:codeRepository
        description: Source code repository URL.
      code_version:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - schema:softwareVersion
        aliases:
          - version
          - git_commit
        annotations:
          nih:source_standard: dig.geneset analysis.version
        description: Version or git commit of the code that ran.
      entrypoint:
        is_a: literal
        mixins: [hashable]
        annotations:
          nih:source_standard: dig.geneset analysis.environment.entrypoint
        description: CLI/module entrypoint invoked.
      container_image:
        is_a: literal
        mixins: [hashable]
        annotations:
          nih:source_standard: dig.geneset analysis.environment.container_image
        description: Container image the activity ran in, if any.
      software_name:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - schema:SoftwareApplication
          - prov:SoftwareAgent
        aliases:
          - software
      software_version:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - schema:softwareVersion
      generated_at_time:
        is_a: literal
        mixins: [unhashable]  # temporal
        range: datetime
        slot_uri: prov:generatedAtTime
        close_mappings:
          - schema:dateCreated
        aliases:
          - generatedAtTime
      has_lineage_step:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: dcterms:hasPart
        close_mappings:
          - prov:hadMember
      has_agentic_workspace:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        description: >-
          AgenticWorkspace id(s) from which this activity can be re-run by an
          AI agent. Complements `command` / `container_image`: those are the
          machine replay path, this is the agentic one. Multivalued because the
          same analysis may be reproducible in more than one workspace.
        annotations:
          nih:profile_level: "3.1"

  AgenticWorkspace:
    is_a: HashableNode
    class_uri: prov:Plan
    description: >-
      A workspace in which an AI agent can re-run an Activity, plus the prompt
      that asks it to. This is the agentic counterpart of the executable
      provenance an Activity already carries: `command` and `container_image`
      tell a machine how to replay a step, while `regeneration_prompt` and
      `workspace_url` tell an agent how to.

      It is typed `prov:Plan` because that is what it is in PROV terms — a
      description of intended execution, not the execution itself. The run
      remains the Activity; this is the recipe the agent follows. Keeping them
      separate matters: re-running a plan produces a NEW Activity, and
      conflating the two would make a regenerated result indistinguishable from
      the original.

      WARNING ON REPRODUCIBILITY. A prompt is not a deterministic replay
      mechanism. The same prompt, workspace, and model can yield a different
      result run to run. Treat `regeneration_prompt` as documentation of intent
      that a human or agent can act on, NOT as a guarantee of bit-identical
      output — that is what `command` plus `container_image` plus
      `code_version` are for. Record the model and version actually used so a
      divergent re-run can at least be explained.
    annotations:
      nih:profile_level: "3.1"
    attributes:
      workspace_url:
        is_a: literal
        mixins: [unhashable]  # environmental
        range: uri
        slot_uri: schema:url
        description: >-
          Resolvable URL for the workspace — where a person or agent goes to
          open it. For akleao this is a fork URL,
          `https://www.akleao.com/fork/<slug-id>`: one shareable link that
          opens the workspace, rather than a path through project and branch
          ids. Required in spirit: a workspace nobody can reach is not
          provenance, it is a note.
        annotations:
          nih:profile_level: "3.1"
      workspace_key:
        is_a: literal
        mixins: [hashable]
        description: >-
          The hosting platform's own identifier for the workspace, when it
          differs from this node's `id` — for an akleao fork, the slug in its
          URL.
        annotations:
          nih:profile_level: "3.1"
      platform:
        is_a: literal
        mixins: [unhashable]  # environmental
        description: >-
          The system hosting the workspace, e.g. "akleao", "Claude Code".
        annotations:
          nih:profile_level: "3.1"
      regeneration_prompt:
        is_a: literal
        mixins: [hashable]
        description: >-
          The prompt that asks an agent to regenerate this analysis. Write it
          self-contained: an agent opening the workspace cold should be able to
          act on it without the surrounding conversation.
        annotations:
          nih:profile_level: "3.1"
      agent_model:
        is_a: literal
        mixins: [hashable]
        description: >-
          Model that ran, or is expected to run, the prompt (e.g.
          "claude-fable-5"). Recorded so a divergent re-run can be explained.
        annotations:
          nih:profile_level: "3.1"
      agent_role:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: >-
          The software agent acting in this workspace — an npx:SoftwareAgent,
          which is also how a nanopublication attributes an assertion to a
          non-human author.
        close_mappings:
          - prov:wasAssociatedWith
        annotations:
          nih:profile_level: "3.1"
      last_run:
        is_a: literal
        mixins: [unhashable]  # temporal
        range: datetime
        description: When the prompt was last executed in this workspace.
        annotations:
          nih:profile_level: "3.1"

  LineageStep:
    is_a: HashableNode
    close_mappings:
      - prov:Activity
    aliases:
      - provenance step
      - lineage entry
    description: One ordered step in a dataset's provenance lineage.
    attributes:
      step:
        is_a: literal
        mixins: [hashable]
        range: integer
        close_mappings:
          - schema:position
        aliases:
          - order
      activity:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - prov:Activity
        description: What happened in this step.
      responsible_party:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - prov:wasAssociatedWith
        description: Party responsible for this step (name or CURIE).

  RecommendedCitation:
    is_a: HashableNode
    related_mappings:
      - dcterms:bibliographicCitation
    aliases:
      - citation
      - how to cite
    description: The recommended human-readable citation and its required elements.
    annotations:
      nih:authoritative: true
      nih:mirror_mutable: false
    attributes:
      citation_text:
        is_a: literal
        mixins: [hashable]
        slot_uri: dcterms:bibliographicCitation
        close_mappings:
          - schema:citation
      required_elements:
        is_a: literal
        mixins: [hashable]
        multivalued: true
        description: Elements a compliant citation must include.

  MirrorProvenance:
    is_a: HashableNode
    class_uri: prov:Entity
    close_mappings:
      - prov:Bundle
    aliases:
      - mirror record
      - cache provenance
    description: >-
      Provenance appended by a mirror/cache. APPEND-ONLY: a mirror may add a
      MirrorProvenance record but must never rewrite authoritative NIH
      provenance (see the mirroring invariant at the top of this schema).
    annotations:
      nih:mirror_mutable: true
      nih:append_only: true
    attributes:
      mirror_provider:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - prov:Agent
        description: e.g. OpenAI, Anthropic, Google, Microsoft, AWS.
      mirror_region:
        is_a: literal
        mixins: [hashable]
      synced_from:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - prov:wasDerivedFrom
        description: Source system the object was synced from (e.g. nih-mcp-gateway).
      sync_time:
        is_a: literal
        mixins: [unhashable]  # temporal
        range: datetime
        close_mappings:
          - prov:generatedAtTime
      source_manifest_hash:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - spdx:checksum
        description: sha256 of the authoritative source manifest.
      mirror_object_hash:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - spdx:checksum
        description: sha256 of the mirrored object.

  # ======================================================================
  # NODE classes — 2.0 ADDITIONS
  # (best-effort interpretation ahead of George's final 2.0 schema)
  # ======================================================================

  DrsObject:
    is_a: HashableNode
    exact_mappings:
      - dcat:Distribution
    close_mappings:
      - schema:DataDownload
    aliases:
      - DRS object
      - drs_object
      - file object
    description: >-
      GA4GH DRS object identity for a dataset file/object. GA4GH DRS is an
      OpenAPI/JSON specification with no RDF vocabulary, so this class carries
      no DRS class_uri — it is grounded in DCAT/schema.org instead, with the
      DRS field names preserved as aliases.
    annotations:
      nih:profile_level: "2.0"
      nih:source_standard: GA4GH DRS v1.x DrsObject
    attributes:
      drs_id:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - schema:identifier
      self_uri:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        close_mappings:
          - dcat:accessURL
        aliases:
          - self_uri
        description: The drs:// self URI.
      size:
        is_a: literal
        mixins: [hashable]
        range: integer
        slot_uri: dcat:byteSize
        close_mappings:
          - schema:contentSize
      checksum_sha256:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - spdx:checksum
        aliases:
          - sha256
      mime_type:
        is_a: literal
        mixins: [hashable]
        slot_uri: dcat:mediaType
        close_mappings:
          - schema:encodingFormat
        aliases:
          - mediaType
      access_methods:
        is_a: literal
        mixins: [hashable]
        multivalued: true
        close_mappings:
          - dcat:accessService
        description: Access method descriptors (e.g. s3, gs, https).

  C2M2File:
    is_a: HashableNode
    mixins:
      - PortalLinked
    exact_mappings:
      - dcat:Distribution
    close_mappings:
      - schema:DataDownload
    aliases:
      - File
      - C2M2 file
      - file node
    description: >-
      A source/intermediate file in a dig.geneset provenance graph, identified
      by CFDE C2M2 (Crosscut Metadata Model) properties. C2M2 is a tabular
      metadata model with no RDF vocabulary, so this class carries no C2M2
      class_uri — it is grounded in DCAT/schema.org, with the C2M2 field names
      preserved as attribute names + `nih:source_standard` annotations (the same
      pattern as DrsObject).
    annotations:
      nih:profile_level: "2.0"
      nih:source_standard: CFDE C2M2 file
    attributes:
      description:
        is_a: literal
        mixins: [hashable]
        slot_uri: dcterms:description
        exact_mappings:
          - schema:description
      filename:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - schema:name
        annotations:
          nih:source_standard: C2M2 filename
      persistent_id:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - datacite:hasIdentifier
        annotations:
          nih:source_standard: C2M2 persistent_id
        description: C2M2 persistent identifier (UUID).
      local_id:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        close_mappings:
          - dcat:accessURL
        annotations:
          nih:source_standard: C2M2 local_id
        description: DCC-local identifier, typically a bucket path (gs://, s3://) or URL.
      c2m2_uuid:
        is_a: literal
        mixins: [hashable]
        aliases:
          - _uuid
        annotations:
          nih:source_standard: C2M2 _uuid
        description: Internal C2M2 UUID for the file node.
      md5:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - spdx:checksum
        annotations:
          nih:source_standard: C2M2 md5
        description: Base64-encoded MD5 checksum of the file.
      sha256:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - spdx:checksum
        annotations:
          nih:source_standard: dig.geneset input.files[].sha256
        description: Hex SHA-256 checksum of the file (from the metadata sidecar).
      size_in_bytes:
        is_a: literal
        mixins: [hashable]
        range: integer
        slot_uri: dcat:byteSize
        close_mappings:
          - schema:contentSize
        annotations:
          nih:source_standard: C2M2 size_in_bytes

  DataUseTerm:
    is_a: HashableNode
    broad_mappings:
      - duo:0000001      # data use permission
      - duo:0000017      # data use modifier
    aliases:
      - data use limitation
      - consent code
      - DUO term
    description: >-
      A Data Use Ontology (DUO) term constraining permitted use of the dataset.
      A term is either a data use permission (child of DUO:0000001) or a data
      use modifier (child of DUO:0000017); use `permission` / `modifier`
      accordingly. Models George's `access.data_use_limitations`.
    annotations:
      nih:profile_level: "2.0"
    attributes:
      duo_id:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        close_mappings:
          - schema:identifier
        aliases:
          - DUO ID
        description: DUO term CURIE (e.g. DUO:0000042).
      duo_label:
        is_a: literal
        mixins: [hashable]
        slot_uri: rdfs:label
        description: Human-readable DUO term label (e.g. "general research use").
      permission:
        is_a: literal
        mixins: [hashable]
        range: DataUsePermissionEnum
        broad_mappings:
          - duo:0000001
        description: The primary data use permission, if this term is a permission.
      modifier:
        is_a: literal
        mixins: [hashable]
        range: DataUseModifierEnum
        broad_mappings:
          - duo:0000017
        description: The data use modifier, if this term is a modifier.

  RoCratePackage:
    is_a: HashableNode
    close_mappings:
      - schema:Dataset
      - dcat:Dataset
    aliases:
      - RO-Crate
      - research object crate
    description: >-
      RO-Crate packaging descriptor for the dataset. RO-Crate expresses itself
      in schema.org terms rather than a vocabulary of its own, so this class is
      grounded in schema.org/DCAT.
    annotations:
      nih:profile_level: "2.0"
      nih:source_standard: RO-Crate 1.1
    attributes:
      conforms_to:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        slot_uri: dcterms:conformsTo
        aliases:
          - conformsTo
        description: RO-Crate spec/profile the crate conforms to.
      ro_crate_metadata_ref:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        close_mappings:
          - schema:mainEntity
        description: Reference to the ro-crate-metadata.json descriptor.
      root_dataset_ref:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        close_mappings:
          - schema:about
        description: Reference to the crate's root Dataset node.

  BioComputeObject:
    is_a: HashableNode
    close_mappings:
      - prov:Plan
      - schema:HowTo
    aliases:
      - BCO
      - IEEE 2791 object
    description: >-
      Executable bioinformatics workflow provenance (BioCompute Object /
      IEEE 2791). Domain slots reference structured 2791 domains. IEEE 2791 is
      published as a JSON Schema (w3id.org/ieee/ieee-2791-schema redirects to
      the IEEE GitLab schema repo), not an RDF vocabulary, so this class
      carries no BCO class_uri; it is grounded in PROV/schema.org with the
      2791 domain names preserved as attribute names.
    annotations:
      nih:profile_level: "2.0"
      nih:source_standard: IEEE 2791-2020 (BioCompute Object)
    attributes:
      bco_id:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        close_mappings:
          - schema:identifier
      bco_spec_version:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - dcterms:conformsTo
      etag:
        is_a: literal
        mixins: [hashable]
        close_mappings:
          - spdx:checksum
      provenance_domain:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
      usability_domain:
        is_a: literal
        mixins: [hashable]
        multivalued: true
      description_domain:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
      execution_domain:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
      io_domain:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
      parametric_domain:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
      error_domain:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie

  # ======================================================================
  # EDGE (relationship) classes — reified attribution/provenance statements.
  # Each `is_a: Edge`; slot_usage documents the expected subject/object and
  # pins the predicate. Use these when a statement itself must be annotated
  # (e.g. the mirror rule) or reified; the Dataset inline attributes above
  # cover the common flat case.
  # ======================================================================

  HasCreator:
    is_a: Edge
    description: Dataset → Agent (authoritative creator).
    annotations:
      nih:authoritative: true
      nih:mirror_mutable: false
    slot_usage:
      subject:
        description: Dataset id.
      predicate:
        ifabsent: string(schema:creator)
      object:
        description: Person/Organization id.

  HasContributor:
    is_a: Edge
    description: Dataset → Agent (contributor).
    slot_usage:
      predicate:
        ifabsent: string(dcterms:contributor)

  FundedBy:
    is_a: Edge
    description: Dataset → Award (authoritative funding).
    annotations:
      nih:authoritative: true
      nih:mirror_mutable: false
    slot_usage:
      predicate:
        ifabsent: string(nih:fundedBy)

  IsDescribedBy:
    is_a: Edge
    description: Dataset → Publication (authoritative primary publication).
    annotations:
      nih:authoritative: true
      nih:mirror_mutable: false
    slot_usage:
      predicate:
        ifabsent: string(dcterms:isReferencedBy)

  WasDerivedFrom:
    is_a: Edge
    description: Dataset → source (Dataset/DrsObject).
    slot_usage:
      predicate:
        ifabsent: string(prov:wasDerivedFrom)

  WasGeneratedBy:
    is_a: Edge
    description: >-
      Dataset/Set → Activity, or (dig.geneset "data output") an output
      C2M2File → the Activity that produced it.
    slot_usage:
      predicate:
        ifabsent: string(prov:wasGeneratedBy)

  Used:
    is_a: Edge
    aliases:
      - data input
      - metadata input
    description: >-
      Activity → an input entity it used (C2M2File/Dataset). Covers the
      dig.geneset "data input" and "metadata input" edge labels; the specific
      role is carried by `edge_role` (ProvEdgeRoleEnum).
    slot_usage:
      predicate:
        ifabsent: string(prov:used)
    attributes:
      edge_role:
        is_a: literal
        mixins: [hashable]
        range: ProvEdgeRoleEnum
        description: Which dig.geneset edge label this reifies.

  WasAttributedTo:
    is_a: Edge
    description: Dataset → Agent.
    slot_usage:
      predicate:
        ifabsent: string(prov:wasAttributedTo)

  HasLineageStep:
    is_a: Edge
    description: Activity → LineageStep.
    slot_usage:
      predicate:
        ifabsent: string(nih:hasLineageStep)

  HasRecommendedCitation:
    is_a: Edge
    description: Dataset → RecommendedCitation (authoritative).
    annotations:
      nih:authoritative: true
      nih:mirror_mutable: false
    slot_usage:
      predicate:
        ifabsent: string(dcterms:bibliographicCitation)

  HasMirrorProvenance:
    is_a: Edge
    description: >-
      Dataset → MirrorProvenance. APPEND-ONLY: mirrors may add this edge but
      must not modify authoritative statements.
    annotations:
      nih:mirror_mutable: true
      nih:append_only: true
    slot_usage:
      predicate:
        ifabsent: string(nih:hasMirrorProvenance)

  HasDataUseTerm:
    is_a: Edge
    description: Dataset → DataUseTerm (DUO).
    annotations:
      nih:profile_level: "2.0"
    slot_usage:
      predicate:
        ifabsent: string(nih:hasDataUseTerm)

  HasDrsObject:
    is_a: Edge
    description: Dataset → DrsObject (GA4GH DRS).
    annotations:
      nih:profile_level: "2.0"
    slot_usage:
      predicate:
        ifabsent: string(nih:hasDrsObject)

  PackagedAs:
    is_a: Edge
    description: Dataset → RoCratePackage.
    annotations:
      nih:profile_level: "2.0"
    slot_usage:
      predicate:
        ifabsent: string(nih:packagedAs)

  HasWorkflowProvenance:
    is_a: Edge
    description: Dataset/Activity → BioComputeObject (IEEE 2791).
    annotations:
      nih:profile_level: "2.0"
    slot_usage:
      predicate:
        ifabsent: string(nih:hasWorkflowProvenance)

# ===========================================================================
# 3.0 BLOCK (A) — DISMECH HARMONIZATION
#
# DISMECH (https://w3id.org/monarch-initiative/dismech) is mirrored into this
# repo VERBATIM from monarch-initiative/dismech and is refreshed by
# models/dismech/pull_dismech.py. It is therefore NOT editable here: any local
# change is silently reverted on the next refresh. All harmonization is
# expressed on THIS side, as mappings and pointers, so both models can evolve
# independently and still line up.
#
# Cross-walk summary (NIH-DAPP <-> DISMECH):
#   nih:Dataset             <-> dismech:Dataset            (complementary halves:
#                                DISMECH describes the science of a dataset,
#                                NIH-DAPP describes its attribution)
#   nih:Publication         <-> dismech:PublicationReference
#   nih:Activity            <-> dismech:CurationEvent      (DISMECH's homegrown
#                                mini-PROV; NIH-DAPP's PROV-O subsumes it)
#   nih:Hypothesis          <-> dismech:MechanisticHypothesis
#   nih:CausalStep          <-> dismech:CausalEdge
#   nih:Mechanism           <-> dismech:Mechanism
#   nih:EvidenceItem        <-> dismech:EvidenceItem
#
# NOTE ON IDENTITY. DISMECH keys a disease by `Disease.name` (a plain string)
# and a dataset by `accession` (a CURIE). NIH-DAPP keys every Node by a
# CURIE/URI `id`. When pointing at a DISMECH entry, prefer the ontology term
# (MONDO CURIE) it carries in `disease_term`, and record the upstream string
# key separately in `dismech_entry_key` so the join is lossless in both
# directions.
# ===========================================================================

  DismechLinked:
    mixin: true
    description: >-
      Mixin adding pointers from a NIH-DAPP node to the DISMECH entry it
      corresponds to. Applied to any class that has a DISMECH counterpart.
      These are POINTERS, not copies — the curated content stays upstream in
      DISMECH and is fetched by following them. This keeps the two models
      harmonized without duplicating (and then drifting from) Monarch's data.
    annotations:
      nih:profile_level: "3.0"
    attributes:
      dismech_class:
        is_a: literal
        mixins: [hashable]
        range: uriorcurie
        description: >-
          CURIE of the DISMECH class this node corresponds to, e.g.
          `dismech:MechanisticHypothesis`. Machine-readable restatement of the
          class-level `exact_mappings`, useful when only an instance is in hand.
        annotations:
          nih:profile_level: "3.0"
      dismech_entry_key:
        is_a: literal
        mixins: [hashable]
        description: >-
          The upstream DISMECH string key for this entry — `Disease.name` for a
          disease, `hypothesis_group_id` for a mechanistic hypothesis. DISMECH
          uses plain strings as identifiers, so this is NOT a CURIE and MUST NOT
          be written into `id`.
        annotations:
          nih:profile_level: "3.0"
      dismech_disease_term:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: >-
          The MONDO CURIE of the DISMECH disease this node attaches to (DISMECH
          `Disease.disease_term` -> DiseaseDescriptor -> Term.id). This is the
          stable, resolvable join key between the two models; prefer it over
          `dismech_entry_key`.
        annotations:
          nih:profile_level: "3.0"
      dismech_source_url:
        is_a: literal
        mixins: [hashable]
        range: uri
        description: >-
          Deep link to the entry on https://dismech.monarchinitiative.org, for
          human review.
        annotations:
          nih:profile_level: "3.0"

# ===========================================================================
# 3.0 BLOCK (B) — NANOPUBLICATION (Nanodash / Knowledge Pixels)
#
# A nanopublication is FOUR NAMED GRAPHS, not one document:
#
#   <np>/Head         np:Nanopublication, and the three functional links:
#                     np:hasAssertion / np:hasProvenance / np:hasPublicationInfo
#   <np>/assertion    the claim itself                     (np:Assertion)
#   <np>/provenance   where the ASSERTION came from        (np:Provenance)
#   <np>/pubinfo      where the NANOPUB came from + sig    (np:PublicationInfo)
#
# LinkML has no named-graph construct, so each graph is modelled here as a
# class and the graph it belongs in is recorded as `nih:np_graph` on that
# class. A serializer walks these annotations to emit TriG/JSON-LD quads; a
# loader reverses it. Class/slot URIs below are quoted from the live ontology
# documents at http://www.nanopub.org/nschema and http://purl.org/nanopub/x/.
#
# WHY THIS FITS NIH-DAPP. The nanopub split is almost exactly the NIH-DAPP
# split, which is why the two compose instead of competing:
#   assertion   <- the scientific claim        (Hypothesis, block C)
#   provenance  <- prov:wasAttributedTo, Activity, LineageStep  (NIH-DAPP 1.0)
#   pubinfo     <- creator / license / created / RecommendedCitation (1.0)
# So `ProvenancedResource` already carries most of what the provenance and
# pubinfo graphs need; the nanopub classes below mostly add IDENTITY (trusty
# URIs), SIGNATURE, and LIFECYCLE.
#
# TRUSTY URIs. A published nanopub's `id` is a trusty URI — the base URI with
# a cryptographic hash of the content (e.g.
# https://w3id.org/np/RAwUp0SmZZwQNOY1zbSPhR21aQoImiUyQrDlyXj5QYXmQ). It is
# therefore CONTENT-ADDRESSED AND IMMUTABLE: you never edit a nanopub, you
# publish a new one that npx:supersedes it. This is a strictly stronger form
# of George's mirroring invariant, and worth saying out loud to him — a signed
# trusty URI makes "a mirror MUST NOT rewrite authoritative provenance"
# cryptographically checkable rather than merely stated.
# ===========================================================================

  Nanopublication:
    is_a: HashableNode
    class_uri: np:Nanopublication
    description: >-
      A nanopublication: an assertion plus its provenance plus its publication
      info, published as one signed, content-addressed unit. All THREE of
      `has_assertion`, `has_provenance` and `has_publication_info` are required
      — the well-formedness rules demand exactly one quad for each, so a nanopub
      with only an assertion is malformed and the network will reject it. `id` is the
      nanopub's trusty URI once published (a draft may use a temporary URI).
    annotations:
      nih:profile_level: "3.0"
      nih:np_graph: Head
      nih:source_standard: Nanopublication schema (http://www.nanopub.org/nschema)
    attributes:
      has_assertion:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: np:hasAssertion
        description: >-
          The assertion graph. REQUIRED: nanopublication well-formedness demands
          exactly one `np:hasAssertion` quad in the Head.
        annotations:
          nih:np_graph: Head
      has_provenance:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: np:hasProvenance
        description: >-
          The provenance graph — where the ASSERTION came from (not where the
          nanopub came from; that is pubinfo). REQUIRED: exactly one, same as
          the assertion. A nanopub carrying only an assertion is malformed.
        annotations:
          nih:np_graph: Head
      has_publication_info:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: np:hasPublicationInfo
        description: >-
          The publication-info graph — where the NANOPUB itself came from.
          REQUIRED: exactly one.
        annotations:
          nih:np_graph: Head
      nanopub_type:
        is_a: literal
        mixins: [hashable]
        range: NanopubTypeEnum
        multivalued: true
        slot_uri: npx:hasNanopubType
        annotations:
          nih:np_graph: pubinfo
      has_signature_element:
        is_a: relationship
        mixins: [unhashable]  # signature
        range: uriorcurie
        slot_uri: npx:hasSignatureElement
        description: The NanopubSignature covering this nanopub.
        annotations:
          nih:np_graph: pubinfo
      supersedes:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: npx:supersedes
        description: >-
          A previously published nanopub this one replaces. Because trusty URIs
          are immutable, this — not editing — is how a nanopub is updated.
        annotations:
          nih:np_graph: pubinfo
      invalidates:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: npx:invalidates
        annotations:
          nih:np_graph: pubinfo
      was_created_at:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: npx:wasCreatedAt
        description: >-
          The service that minted this nanopub, e.g.
          https://nanodash.knowledgepixels.com/.
        annotations:
          nih:np_graph: pubinfo
      created_from_template:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: ntemplate:wasCreatedFromTemplate
        description: >-
          The Nanodash template this nanopub was instantiated from. Knowledge
          Pixels tooling emits this alongside
          `ntemplate:wasCreatedFromProvenanceTemplate` and
          `...FromPubinfoTemplate`.
        annotations:
          nih:np_graph: pubinfo
      created:
        is_a: literal
        mixins: [unhashable]  # temporal
        range: datetime
        slot_uri: dcterms:created
        annotations:
          nih:np_graph: pubinfo
      creator:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: dcterms:creator
        description: ORCID(s) of the nanopub's creator.
        annotations:
          nih:np_graph: pubinfo
      nanopub_license:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: dcterms:license
        annotations:
          nih:np_graph: pubinfo
      label:
        is_a: literal
        mixins: [hashable]
        slot_uri: rdfs:label
        annotations:
          nih:np_graph: pubinfo
      trusty_uri:
        is_a: literal
        mixins: [unhashable]   # assigned after the content exists
        range: uri
        description: >-
          The real Trusty URI (an `RA…` artifact code) minted by nanopub-java
          when this nanopublication is actually published. NOT computed by
          schema/identity — see schema/trusty-identifiers.md, which is explicit
          that `RA` must not be reimplemented or approximated.

          Distinct from `id`, which is this repository's own
          `dapper:Nanopublication.{digest}` content address. Two identifiers,
          two different guarantees: keep them separate and never conflate them.
        annotations:
          nih:profile_level: "3.2"
          nih:np_graph: Head

  NanopubAssertion:
    is_a: HashableNode
    class_uri: np:Assertion
    description: >-
      The assertion graph — the claim being made, and the only part a reader is
      asked to believe. In this profile the assertion is normally a
      `Hypothesis` (block C); `asserts` points at it.
    annotations:
      nih:profile_level: "3.0"
      nih:np_graph: assertion
    attributes:
      asserts:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: hycl:claims
        description: >-
          The claim carried by this assertion graph — typically a Hypothesis id.
      as_sentence:
        is_a: literal
        mixins: [hashable]
        slot_uri: npx:asSentence
        description: >-
          An English rendering of the assertion. When it is a single
          self-contained sentence with an unambiguous subject, this is an
          AIDA sentence (hycl:AIDA-Sentence).
        close_mappings:
          - hycl:AIDA-Sentence

  NanopubProvenance:
    is_a: HashableNode
    class_uri: np:Provenance
    description: >-
      The provenance graph — where the ASSERTION came from (not where the
      nanopub came from; that is pubinfo). Its subject is the assertion graph.
      This is the natural home for a NIH-DAPP `Activity` / `LineageStep` chain.
    annotations:
      nih:profile_level: "3.0"
      nih:np_graph: provenance
    attributes:
      provenance_of:
        is_a: relationship
        mixins: [unhashable]  # back-reference
        range: uriorcurie
        description: The assertion graph this provenance describes.
      was_attributed_to:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: prov:wasAttributedTo
        description: >-
          Agent the assertion is attributed to — an ORCID for a person, or an
          npx:SoftwareAgent / npx:SoftwareTool for a generating pipeline such
          as REVEAL.
      generated_by_activity:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: prov:wasGeneratedBy
        description: NIH-DAPP Activity id that produced the assertion.
      derived_from:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        slot_uri: prov:wasDerivedFrom
        description: >-
          Source entities the assertion was derived from — Dataset, GeneSet, or
          Publication ids.

  NanopubPublicationInfo:
    is_a: HashableNode
    class_uri: np:PublicationInfo
    description: >-
      The publication-info graph — metadata about the NANOPUB itself: who
      published it, when, under what licence, with what signature. Overlaps
      almost exactly with the NIH-DAPP attribution core.
    annotations:
      nih:profile_level: "3.0"
      nih:np_graph: pubinfo
    attributes:
      pubinfo_of:
        is_a: relationship
        mixins: [unhashable]  # back-reference
        range: uriorcurie
        description: The nanopub this publication info describes.

  NanopubSignature:
    is_a: HashableNode
    class_uri: npx:NanopubSignatureElement
    description: >-
      The cryptographic signature over a nanopublication. Published nanopubs in
      the Knowledge Pixels network are RSA-signed and keyed to the signer's
      ORCID; verifying the signature plus recomputing the trusty-URI hash
      proves the content has not been altered since publication.
    annotations:
      nih:profile_level: "3.0"
      nih:np_graph: pubinfo
      nih:mirror_mutable: false
    attributes:
      has_algorithm:
        is_a: literal
        mixins: [hashable]
        slot_uri: npx:hasAlgorithm
        description: Signature algorithm, e.g. "RSA".
      has_public_key:
        is_a: literal
        mixins: [hashable]
        slot_uri: npx:hasPublicKey
        description: Base64 public key of the signer.
      has_signature:
        is_a: literal
        mixins: [hashable]
        slot_uri: npx:hasSignature
        description: Base64 signature value.
      signed_by:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        slot_uri: npx:signedBy
        description: Agent that signed — an ORCID.
      has_signature_target:
        is_a: relationship
        mixins: [unhashable]  # signature + back-reference
        range: uriorcurie
        slot_uri: npx:hasSignatureTarget
        description: The nanopub this signature covers.

  # ---- nanopub edges -------------------------------------------------------

  HasAssertion:
    is_a: Edge
    description: Nanopublication → NanopubAssertion.
    annotations:
      nih:profile_level: "3.0"
    slot_usage:
      predicate:
        ifabsent: string(np:hasAssertion)

  HasProvenanceGraph:
    is_a: Edge
    description: Nanopublication → NanopubProvenance.
    annotations:
      nih:profile_level: "3.0"
    slot_usage:
      predicate:
        ifabsent: string(np:hasProvenance)

  HasPublicationInfo:
    is_a: Edge
    description: Nanopublication → NanopubPublicationInfo.
    annotations:
      nih:profile_level: "3.0"
    slot_usage:
      predicate:
        ifabsent: string(np:hasPublicationInfo)

  Supersedes:
    is_a: Edge
    description: >-
      Nanopublication → Nanopublication. The update mechanism for immutable
      trusty-URI artifacts.
    annotations:
      nih:profile_level: "3.0"
    slot_usage:
      predicate:
        ifabsent: string(npx:supersedes)

# ===========================================================================
# 3.0 BLOCK (C) — HYPOTHESIS (the REVEAL output)
#
# REVEAL emits a mechanistic hypothesis relating a GENE to a DISEASE through a
# MECHANISM. The milestone is "define hypothesis schema", and the requirement
# is that it be (i) a FAIR digital object with full metadata and provenance,
# (ii) in a format compatible with dismech.monarchinitiative.org, and
# (iii) recognizably compatible with the portal-wide provenance/FAIRness work
# (Jeremy's KPN, Vlado's gene sets).
#
# HOW EACH REQUIREMENT IS MET
#   FAIR digital object   -> Hypothesis is_a Node (globally unique resolvable
#                            `id`) + mixin ProvenancedResource, so it carries
#                            creators, funding, licence, access level, derived-
#                            from, and a recommended citation exactly like a
#                            Dataset. Findable/Accessible/Interoperable/
#                            Reusable falls out of reusing the 1.0 core rather
#                            than inventing a parallel metadata block.
#   DISMECH compatibility -> The chain shape is DISMECH's. A Hypothesis maps to
#                            dismech:MechanisticHypothesis (the grouping object:
#                            hypothesis_group_id / hypothesis_label / status)
#                            and each CausalStep maps to dismech:CausalEdge
#                            (target / causal_link_type / intermediate_
#                            mechanisms / evidence), REUSING its
#                            CausalLinkTypeEnum values verbatim. In DISMECH the
#                            grouping and the edges are linked by string
#                            `hypothesis_groups`; here they are linked by node
#                            id, and `dismech_entry_key` preserves the string
#                            so the join survives a round trip.
#   Portal compatibility  -> A Hypothesis is publishable as a signed
#                            nanopublication via block (B): the Hypothesis is
#                            the assertion, its ProvenancedResource slots
#                            populate the provenance and pubinfo graphs.
#
# HYPOTHESIS vs NANOPUBLICATION — why both, and how they relate.
#
# The intuition that "everything is a hypothesis, and a nanopub is a hypothesis
# with support" is very close to right, and the precise version is worth
# stating because it decides the shape of this block.
#
#   A HYPOTHESIS is CONTENT — a claim. It may be atomic ("PCSK9 binds the
#   LDLR EGF-A domain") or composite (a multi-step causal chain). It is
#   mutable: its status moves proposed -> canonical -> contested as the field
#   argues, and support accrues to it over time.
#
#   A NANOPUBLICATION is a PUBLICATION ACT — one assertion, plus who asserted
#   it, plus where that assertion came from, signed and content-addressed. It
#   is immutable by construction.
#
# So the two are not rivals and neither contains the other in general:
#   * Publishing a hypothesis MINTS a nanopub whose assertion is that
#     hypothesis                                    -> `asserted_in`
#   * Support for a hypothesis ARRIVES AS OTHER NANOPUBS, each asserting its
#     own atomic claim with its own provenance       -> `supported_by_nanopub`
#
# The deciding argument is immutability. A published nanopub's id is a trusty
# URI — a hash of its content. Nest the evidence inside the hypothesis's own
# nanopub and every new supporting study rewrites the hash, so the identity of
# the hypothesis changes each time someone supports it; the citation you
# published last month no longer resolves to the same object. Keeping support
# as links FROM a mutable Hypothesis node TO immutable nanopubs is what lets
# each claim keep a stable identity while the body of evidence grows.
#
# This also means the recursion the intuition points at is real and is
# expressible: a supporting nanopub's assertion may itself be a Hypothesis (an
# atomic one). "Everything is a hypothesis" holds; a nanopub is the signed,
# dated, attributed act of putting one on the record.
#
# GENERALISATION. The advisor notes hypothesis types may broaden beyond
# gene -> mechanism -> disease. `Hypothesis` therefore does NOT hard-code
# gene/disease slots as required: the chain is an ordered list of CausalSteps
# over `uriorcurie` endpoints, and `subject_entity` / `object_entity` are the
# generic ends. `subject_gene` / `object_disease` are convenience accessors
# for the gene -> disease case REVEAL starts with.
# ===========================================================================

  Hypothesis:
    is_a: HashableNode
    mixins:
      - ProvenancedResource
      - DismechLinked
    class_uri: hycl:Statement
    description: >-
      A mechanistic hypothesis: a claim that a subject entity (initially a
      gene) contributes to an object entity (initially a disease) through an
      ordered chain of mechanisms. A FAIR digital object — citable, attributed,
      funded, licensed — and publishable as a nanopublication.
    exact_mappings:
      - dismech:MechanisticHypothesis
    close_mappings:
      - hycl:Statement
    annotations:
      nih:profile_level: "3.0"
      nih:source_standard: DISMECH MechanisticHypothesis
    attributes:
      hypothesis_label:
        is_a: literal
        mixins: [hashable]
        description: Short human-readable label, e.g. "PCSK9 GOF -> LDLR degradation -> FH".
        exact_mappings:
          - dismech:hypothesis_label
      statement:
        is_a: literal
        mixins: [hashable]
        slot_uri: npx:asSentence
        description: >-
          The hypothesis as one self-contained English sentence with an
          unambiguous subject (an AIDA sentence). This is what a reader is
          asked to evaluate, and what becomes `npx:asSentence` when the
          hypothesis is published as a nanopublication.
        close_mappings:
          - hycl:AIDA-Sentence
      status:
        is_a: literal
        mixins: [hashable]
        range: HypothesisStatusEnum
        close_mappings:
          - dismech:status
      description:
        is_a: literal
        mixins: [hashable]
        description: Longer prose statement of the hypothesis and its rationale.
      subject_entity:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: >-
          The upstream end of the chain. Generic form; for REVEAL's initial
          scope this is a gene (see `subject_gene`).
      subject_gene:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: >-
          Convenience accessor for the gene at the upstream end, as an HGNC
          CURIE (e.g. `HGNC:20001` for PCSK9). When set, SHOULD equal `subject_entity`.
      object_entity:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: The downstream end of the chain. Generic form.
      object_disease:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: >-
          Convenience accessor for the disease at the downstream end, as a
          MONDO CURIE (e.g. `MONDO:0005439`). When set, SHOULD equal
          `object_entity`. This is also the join key into DISMECH
          (`Disease.disease_term`).
      has_causal_step:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        description: >-
          The ordered gene -> mechanism -> disease chain, as CausalStep ids.
          Order is carried by each step's `step_index`, not by list position,
          so the chain survives set-valued RDF round trips.
      applies_to_subtypes:
        is_a: literal
        mixins: [hashable]
        multivalued: true
        description: >-
          Disease subtypes this hypothesis is scoped to. Mirrors DISMECH
          `MechanisticHypothesis.applies_to_subtypes`.
        exact_mappings:
          - dismech:applies_to_subtypes
      confidence:
        is_a: literal
        mixins: [hashable]
        range: float
        minimum_value: 0.0
        maximum_value: 1.0
        description: >-
          Optional calibrated confidence in [0,1] as reported by the generating
          system. NOT a substitute for evidence — a hypothesis with high
          confidence and no `has_evidence` is not publishable.
      has_evidence:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        description: EvidenceItem ids supporting or refuting this hypothesis.
      asserted_in:
        is_a: relationship
        mixins: [unhashable]  # back-reference
        range: uriorcurie
        multivalued: true
        description: >-
          Nanopublication id(s) in which THIS hypothesis is the assertion —
          i.e. publishing this claim. See `supported_by_nanopub` for the other
          direction (nanopubs that support it).
      supported_by_nanopub:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        description: >-
          Nanopublication id(s) whose assertions SUPPORT this hypothesis. Each
          such nanopub is a separate, independently-signed atomic claim with
          its own provenance chain back to the analysis and dataset that
          produced it — which is what makes a claim traceable end to end.

          Support lives HERE, outside the nanopub, deliberately. A published
          nanopub is addressed by a trusty URI, i.e. a hash of its own content:
          it is immutable. If evidence were nested inside the hypothesis's own
          nanopub, every newly-accrued supporting study would change the hash
          and therefore change the hypothesis's identity — the thing you cite
          would move under you. Accumulating support as links from a mutable
          Hypothesis node to immutable nanopubs keeps the identity of each
          claim stable while the body of support grows.
      refuted_by_nanopub:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        description: >-
          Nanopublication id(s) whose assertions ARGUE AGAINST this hypothesis.
          Same rationale as `supported_by_nanopub`; kept separate so a
          hypothesis can carry both and be judged on the balance.

  CausalStep:
    is_a: HashableNode
    mixins:
      - DismechLinked
    description: >-
      One ordered link in a hypothesis's causal chain: subject -> object, with
      a directness classification and optional intermediates. Deliberately
      shaped as DISMECH's `CausalEdge` so a chain can be written into a DISMECH
      entry, or read out of one, without translation.
    exact_mappings:
      - dismech:CausalEdge
    annotations:
      nih:profile_level: "3.0"
      nih:source_standard: DISMECH CausalEdge
    attributes:
      step_index:
        is_a: literal
        mixins: [hashable]
        range: integer
        minimum_value: 0
        description: >-
          0-based position in the chain. Carries the ordering explicitly
          because RDF graphs are unordered.
      step_subject:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: Upstream end of this step (gene, variant, mechanism, phenotype, ...).
      step_object:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: >-
          Downstream end of this step. Corresponds to DISMECH `CausalEdge.target`.
        exact_mappings:
          - dismech:target
      causal_link_type:
        is_a: literal
        mixins: [hashable]
        range: CausalLinkTypeEnum
        description: >-
          Directness of the step. Values are DISMECH's verbatim.
        exact_mappings:
          - dismech:causal_link_type
      intermediate_mechanisms:
        is_a: literal
        mixins: [hashable]
        multivalued: true
        description: >-
          Known intervening mechanisms, required in spirit when
          `causal_link_type` is INDIRECT_KNOWN_INTERMEDIATES.
        exact_mappings:
          - dismech:intermediate_mechanisms
      via_mechanism:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        description: Mechanism node ids for this step (structured counterpart of the above).
      description:
        is_a: literal
        mixins: [hashable]
      has_evidence:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        description: EvidenceItem ids for this specific step.

  Mechanism:
    is_a: HashableNode
    mixins:
      - DismechLinked
    description: >-
      A biological mechanism invoked by a causal step. Intentionally thin —
      DISMECH's `Mechanism` is `name` + `description`, and the rich
      pathophysiology (cell types, biological processes, pathways, locations)
      lives upstream in DISMECH's `Pathophysiology`. Point at it with
      `DismechLinked` rather than copying it here.
    exact_mappings:
      - dismech:Mechanism
    close_mappings:
      - dismech:Pathophysiology
    annotations:
      nih:profile_level: "3.0"
    attributes:
      description:
        is_a: literal
        mixins: [hashable]
      biological_process:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        multivalued: true
        description: GO biological process CURIE(s), e.g. `obo:GO_0006629`.

  EvidenceItem:
    is_a: HashableNode
    description: >-
      A single piece of evidence for or against a claim. Shaped as DISMECH's
      `EvidenceItem` so evidence transfers between the two models intact.
      DISMECH carries direction as a boolean `supports`; this uses an explicit
      enum so "mixed" and "unknown" are sayable.
    exact_mappings:
      - dismech:EvidenceItem
    annotations:
      nih:profile_level: "3.0"
      nih:source_standard: DISMECH EvidenceItem
    attributes:
      reference:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: >-
          The publication this evidence comes from — a Publication node id, or
          a `PMID:` CURIE.
        exact_mappings:
          - dismech:reference
      reference_title:
        is_a: literal
        mixins: [hashable]
        exact_mappings:
          - dismech:reference_title
      direction:
        is_a: literal
        mixins: [hashable]
        range: EvidenceDirectionEnum
        description: Whether this evidence supports or refutes the claim.
        close_mappings:
          - dismech:supports
      evidence_source:
        is_a: literal
        mixins: [hashable]
        description: Where the evidence was drawn from (database, deep-research run, ...).
        exact_mappings:
          - dismech:evidence_source
      snippet:
        is_a: literal
        mixins: [hashable]
        description: Verbatim quoted passage supporting the claim.
        exact_mappings:
          - dismech:snippet
      explanation:
        is_a: literal
        mixins: [hashable]
        description: Curator/agent explanation of how the snippet bears on the claim.
        exact_mappings:
          - dismech:explanation
      from_nanopub:
        is_a: relationship
        mixins: [hashable]
        range: uriorcurie
        description: >-
          The nanopublication this evidence is drawn from, when the evidence is
          itself a published, signed claim rather than a passage from a paper.
          Following it reaches that claim's own provenance graph, and from
          there the analysis and dataset it rests on.
        annotations:
          nih:profile_level: "3.0" 

  # ---- hypothesis edges ----------------------------------------------------

  HasCausalStep:
    is_a: Edge
    description: Hypothesis → CausalStep.
    annotations:
      nih:profile_level: "3.0"
    slot_usage:
      predicate:
        ifabsent: string(nih:hasCausalStep)

  HasEvidence:
    is_a: Edge
    description: Hypothesis/CausalStep → EvidenceItem.
    annotations:
      nih:profile_level: "3.0"
    slot_usage:
      predicate:
        ifabsent: string(nih:hasEvidence)

  AssertedIn:
    is_a: Edge
    description: >-
      Hypothesis → Nanopublication. The bridge between block (C) and block (B):
      it records that this hypothesis was published as the assertion of a
      signed, content-addressed nanopublication.
    annotations:
      nih:profile_level: "3.0"
    slot_usage:
      predicate:
        ifabsent: string(hycl:claims)

  SupportedByNanopub:
    is_a: Edge
    description: >-
      Hypothesis → Nanopublication that supports it. The reified form of
      `Hypothesis.supported_by_nanopub`; traversing it and then that nanopub's
      `np:hasProvenance` is the path from a hypothesis to the datasets its
      support rests on.
    annotations:
      nih:profile_level: "3.0"
    slot_usage:
      predicate:
        ifabsent: string(nih:supportedByNanopub)

  HasAgenticWorkspace:
    is_a: Edge
    description: >-
      Activity → AgenticWorkspace. Reified form of
      `Activity.has_agentic_workspace`: the workspace and prompt from which
      this analysis can be re-run by an agent.
    annotations:
      nih:profile_level: "3.1"
    slot_usage:
      subject:
        description: Activity id.
      predicate:
        ifabsent: string(nih:hasAgenticWorkspace)
      object:
        description: AgenticWorkspace id.

  CorrespondsToDismech:
    is_a: Edge
    description: >-
      Any NIH-DAPP node → the DISMECH entry it corresponds to. The instance-
      level counterpart of the class-level `exact_mappings` in block (A).
    annotations:
      nih:profile_level: "3.0"
    slot_usage:
      subject:
        description: NIH-DAPP node id.
      predicate:
        ifabsent: string(skos:closeMatch)
      object:
        description: DISMECH entry identifier (prefer the MONDO CURIE).
