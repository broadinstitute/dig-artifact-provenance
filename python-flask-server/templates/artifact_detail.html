<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artifact Detail</title>
  <script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3efe5;
      --panel: #fffdf7;
      --ink: #1c1a16;
      --muted: #6b6255;
      --accent: #0e6b63;
      --border: #d7cfbf;
      --code: #f6f1e4;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(180deg, #ede5d4 0%, var(--bg) 42%, #f7f4ec 100%);
      color: var(--ink);
    }

    .page {
      max-width: 1080px;
      margin: 0 auto;
      padding: 28px 20px 56px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 14px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .panel {
      background: rgba(255, 253, 247, 0.94);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px 24px;
      box-shadow: 0 14px 30px rgba(28, 26, 22, 0.08);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      line-height: 1.05;
      word-break: break-word;
    }

    .muted {
      color: var(--muted);
      margin-bottom: 18px;
    }

    .error {
      color: #a12626;
      display: none;
      margin-bottom: 16px;
    }

    .field-block + .field-block {
      margin-top: 18px;
    }

    .field-label {
      font-weight: 700;
      margin-bottom: 8px;
    }

    .field-value {
      word-break: break-word;
    }

    dl {
      display: grid;
      grid-template-columns: minmax(160px, 220px) 1fr;
      gap: 12px 18px;
      margin: 0;
    }

    dt {
      font-weight: 700;
    }

    dd {
      margin: 0;
      word-break: break-word;
    }

    pre {
      margin: 0;
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--code);
      border: 1px solid #e5dcc8;
      overflow: auto;
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .graph-shell {
      border: 1px solid #e5dcc8;
      border-radius: 12px;
      background: linear-gradient(180deg, #faf5ea 0%, #f6f1e4 100%);
      overflow: hidden;
    }

    #provenance-graph {
      width: 100%;
      height: 640px;
    }

    .graph-meta {
      padding: 10px 14px;
      border-bottom: 1px solid #e5dcc8;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .graph-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid #e5dcc8;
      background: rgba(255, 253, 247, 0.72);
      color: var(--muted);
      font-size: 0.86rem;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .legend-shape {
      display: inline-block;
      width: 14px;
      height: 14px;
      background: #0e6b63;
      border: 2px solid #094842;
      box-sizing: border-box;
    }

    .legend-activity {
      width: 18px;
      border-radius: 4px;
      background: #d17b0f;
      border-color: #9c5704;
    }

    .legend-dataset {
      border-radius: 50%;
      background: #59603a;
      border-color: #3c4126;
    }

    .legend-drs {
      transform: rotate(45deg);
      background: #225f9d;
      border-color: #153f68;
    }

    .legend-c2m2 {
      clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%);
      background: #7b4c88;
      border-color: #573160;
    }

    .legend-open {
      width: 16px;
      height: 16px;
      border: 4px solid #111;
      background: #225f9d;
      transform: rotate(45deg);
    }

    .graph-empty {
      padding: 14px 16px;
      color: var(--muted);
    }

    @media (max-width: 720px) {
      dl {
        grid-template-columns: 1fr;
      }

      #provenance-graph {
        height: 520px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="back-link" href="../">&larr; Back to Artifact Provenance</a>

    <section class="panel">
      <h1 id="title">{{ artifact_id }}</h1>
      <div class="muted">Database row details from the provenance service.</div>
      <div class="error" id="error-box"></div>
      <div id="detail-list"></div>
    </section>
  </main>

  <script>
    const artifactId = {{ artifact_id|tojson }};
    const getProvenanceUrl = new URL("../get_provenance", window.location.href).toString();

    function formatValue(value) {
      if (value === null) {
        return document.createTextNode("null");
      }

      if (typeof value === "object") {
        const pre = document.createElement("pre");
        pre.textContent = JSON.stringify(value, null, 2);
        return pre;
      }

      return document.createTextNode(String(value));
    }

    function appendField(container, key, value) {
      const block = document.createElement("section");
      block.className = "field-block";

      const label = document.createElement("div");
      label.className = "field-label";
      label.textContent = key;

      const fieldValue = document.createElement("div");
      fieldValue.className = "field-value";
      fieldValue.appendChild(formatValue(value));

      block.appendChild(label);
      block.appendChild(fieldValue);
      container.appendChild(block);
    }

    function labelForNode(nodeId, nodeIndex) {
      const node = nodeIndex.get(nodeId) || {};
      return node.label || node.name || node.stage_name || nodeId;
    }

    function buildTopDownGraph(edges, nodeIds) {
      const adjacency = new Map();
      const incomingCount = new Map();

      for (const nodeId of nodeIds) {
        adjacency.set(nodeId, []);
        incomingCount.set(nodeId, 0);
      }

      for (const edge of edges) {
        if (!edge.source || !edge.target) {
          continue;
        }

        // Stored provenance points from products to provenance dependencies.
        // Display it as input -> activity -> output so the graph reads top-down.
        const visualSource = edge.target;
        const visualTarget = edge.source;
        adjacency.get(visualSource)?.push(visualTarget);
        incomingCount.set(visualTarget, (incomingCount.get(visualTarget) || 0) + 1);
      }

      const roots = [...nodeIds].filter((nodeId) => (incomingCount.get(nodeId) || 0) === 0).sort();
      const depth = new Map();
      const queue = roots.map((nodeId) => {
        depth.set(nodeId, 0);
        return nodeId;
      });

      while (queue.length > 0) {
        const nodeId = queue.shift();
        const nextDepth = (depth.get(nodeId) || 0) + 1;

        for (const nextNode of adjacency.get(nodeId) || []) {
          if (!depth.has(nextNode) || nextDepth > depth.get(nextNode)) {
            depth.set(nextNode, nextDepth);
            queue.push(nextNode);
          }
        }
      }

      for (const nodeId of nodeIds) {
        if (!depth.has(nodeId)) {
          depth.set(nodeId, 0);
        }
      }

      const layers = new Map();
      for (const nodeId of nodeIds) {
        const layer = depth.get(nodeId) || 0;
        if (!layers.has(layer)) {
          layers.set(layer, []);
        }
        layers.get(layer).push(nodeId);
      }

      const maxLayer = Math.max(...layers.keys(), 0);
      const width = Math.max(900, Math.max(...[...layers.values()].map((layer) => layer.length), 1) * 180);
      const height = Math.max(560, (maxLayer + 1) * 120);
      const positions = new Map();

      for (const [layer, layerNodes] of layers.entries()) {
        layerNodes.sort();
        const y = 70 + layer * ((height - 140) / Math.max(maxLayer, 1));
        const spacing = width / (layerNodes.length + 1);

        layerNodes.forEach((nodeId, index) => {
          positions.set(nodeId, {
            x: spacing * (index + 1),
            y,
          });
        });
      }

      return {positions, width, height, roots};
    }

    function buildGraphElements(provenance) {
      const shell = document.createElement("section");
      shell.className = "field-block";

      const label = document.createElement("div");
      label.className = "field-label";
      label.textContent = "graph";
      shell.appendChild(label);

      const edges = Array.isArray(provenance?.edges) ? provenance.edges : [];
      const rawNodes = Array.isArray(provenance?.graph?.nodes) ? provenance.graph.nodes : [];
      const nodeIndex = new Map(rawNodes.map((node) => [node.id, node]));

      const graphShell = document.createElement("div");
      graphShell.className = "graph-shell";

      const meta = document.createElement("div");
      meta.className = "graph-meta";
      meta.textContent = `${rawNodes.length || 0} nodes, ${edges.length} edges`;
      graphShell.appendChild(meta);

      const legend = document.createElement("div");
      legend.className = "graph-legend";
      legend.innerHTML = `
        <span class="legend-item"><span class="legend-shape legend-c2m2"></span>File input/intermediate</span>
        <span class="legend-item"><span class="legend-shape legend-activity"></span>Process activity</span>
        <span class="legend-item"><span class="legend-shape legend-dataset"></span>Dataset result</span>
        <span class="legend-item"><span class="legend-shape legend-drs"></span>DRS object</span>
        <span class="legend-item"><span class="legend-shape legend-open"></span>Published endpoint</span>
      `;
      graphShell.appendChild(legend);

      if (edges.length === 0) {
        const empty = document.createElement("div");
        empty.className = "graph-empty";
        empty.textContent = "No provenance edges are available for this artifact.";
        graphShell.appendChild(empty);
        shell.appendChild(graphShell);
        return shell;
      }

      const graphContainer = document.createElement("div");
      graphContainer.id = "provenance-graph";
      graphShell.appendChild(graphContainer);
      shell.appendChild(graphShell);

      const nodeIds = new Set();
      const elements = [];

      for (const edge of edges) {
        if (edge.source) {
          nodeIds.add(edge.source);
        }
        if (edge.target) {
          nodeIds.add(edge.target);
        }
      }

      const layoutGraph = buildTopDownGraph(edges, nodeIds);
      graphContainer.style.height = `${Math.min(Math.max(layoutGraph.height, 520), 1200)}px`;

      for (const nodeId of nodeIds) {
        const node = nodeIndex.get(nodeId) || {};
        elements.push({
          data: {
            id: nodeId,
            label: labelForNode(nodeId, nodeIndex),
            dapperClass: node.dapper_class || "Unknown",
            directoryKind: node.directory_kind || "",
            graphRole: layoutGraph.roots.includes(nodeId) ? "input" : "",
          },
          position: layoutGraph.positions.get(nodeId),
        });
      }

      for (const edge of edges) {
        if (!edge.source || !edge.target) {
          continue;
        }

        elements.push({
          data: {
            id: edge.id || `${edge.source}-${edge.target}-${edge.relationship || "edge"}`,
            source: edge.target,
            target: edge.source,
            provenanceSource: edge.source,
            provenanceTarget: edge.target,
          },
        });
      }

      setTimeout(() => {
        cytoscape({
          container: graphContainer,
          elements,
          style: [
            {
              selector: "node",
              style: {
                "background-color": "#0e6b63",
                "border-width": 2,
                "border-color": "#094842",
                "color": "#111",
                "label": "data(label)",
                "font-size": 9,
                "text-wrap": "wrap",
                "text-max-width": 132,
                "text-valign": "bottom",
                "text-margin-y": 10,
                "width": 20,
                "height": 20,
              },
            },
            {
              selector: 'node[dapperClass = "Activity"]',
              style: {
                "background-color": "#d17b0f",
                "border-color": "#9c5704",
                "shape": "round-rectangle",
                "width": 28,
                "height": 28,
              },
            },
            {
              selector: 'node[dapperClass = "DrsObject"]',
              style: {
                "background-color": "#225f9d",
                "border-color": "#153f68",
                "shape": "diamond",
              },
            },
            {
              selector: 'node[dapperClass = "Dataset"]',
              style: {
                "background-color": "#59603a",
                "border-color": "#3c4126",
                "shape": "ellipse",
              },
            },
            {
              selector: 'node[dapperClass = "C2M2File"]',
              style: {
                "background-color": "#7b4c88",
                "border-color": "#573160",
                "shape": "hexagon",
              },
            },
            {
              selector: 'node[directoryKind = "open_data_endpoint"]',
              style: {
                "border-width": 4,
                "border-color": "#111",
              },
            },
            {
              selector: "edge",
              style: {
                "width": 2,
                "line-color": "#8b8a83",
                "target-arrow-color": "#8b8a83",
                "target-arrow-shape": "triangle",
                "curve-style": "taxi",
                "taxi-direction": "downward",
                "taxi-turn": 24,
              },
            },
          ],
          layout: {
            name: "preset",
            fit: true,
            padding: 48,
          },
          wheelSensitivity: 0.25,
        });
      }, 0);

      return shell;
    }

    function renderArtifactDetails(container, payload) {
      container.innerHTML = "";

      appendField(container, "id", payload.id);
      appendField(container, "pipeline_type", payload.pipeline_type);
      container.appendChild(buildGraphElements(payload.provenance));
      appendField(container, "provenance", payload.provenance);

      for (const [key, value] of Object.entries(payload)) {
        if (["id", "name", "pipeline_type", "provenance"].includes(key)) {
          continue;
        }

        appendField(container, key, value);
      }
    }

    async function loadArtifact() {
      const details = document.getElementById("detail-list");
      const errorBox = document.getElementById("error-box");
      const title = document.getElementById("title");

      try {
        const requestUrl = new URL(getProvenanceUrl);
        requestUrl.searchParams.set("id", artifactId);
        const response = await fetch(requestUrl);
        const payload = await response.json();

        if (!response.ok) {
          throw new Error(payload.message || "Failed to load provenance record.");
        }

        title.textContent = payload.name || payload.id || artifactId;
        renderArtifactDetails(details, payload);
      } catch (error) {
        errorBox.style.display = "block";
        errorBox.textContent = error.message;
      }
    }

    loadArtifact();
  </script>
</body>
</html>
